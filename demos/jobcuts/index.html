<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StoryCharts Demo - Job Cuts</title>
    <link rel="stylesheet" href="https://uicdn.toast.com/chart/latest/toastui-chart.min.css" />
    <link rel="stylesheet" href="../../packages/theme/sc-theme.css" />
    <style>
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: linear-gradient(180deg, #f9fafb, #ffffff);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(280px, 360px) 1fr;
        min-height: 100vh;
      }
      .story {
        padding: 32px 20px;
      }
      .story-step {
        margin: 0 0 140px;
        color: #344054;
      }
      .viz {
        position: sticky;
        top: 0;
        height: 100vh;
        padding: 40px;
      }
      #chart {
        height: 540px;
        background: #fff;
        border: 1px solid #e4e7ec;
        border-radius: 10px;
      }
      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }
        .viz {
          position: relative;
          height: auto;
          padding-top: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="layout">
      <section class="story">
        <div class="story-step">Baseline: January bars are black.</div>
        <div class="story-step">Second step: highlight June bars in pink.</div>
        <div class="story-step">Final step: callout for January 2026.</div>
      </section>
      <section class="viz">
        <div id="chart"></div>
      </section>
    </div>

    <script src="https://uicdn.toast.com/chart/latest/toastui-chart.min.js"></script>
    <script type="module" src="./jobcuts.ts"></script>
  </body>
</html>
